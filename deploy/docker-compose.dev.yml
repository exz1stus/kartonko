services:
    backend:
        build:
            context: ../backend
            dockerfile: Dockerfile.dev
        container_name: backend
        environment:
            GARAGE_ENDPOINT: ${GARAGE_ENDPOINT}
            GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
            GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
            GARAGE_BUCKET_NAME: ${GARAGE_BUCKET_NAME}

            DB_HOST: ${DB_HOST}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_NAME: ${DB_NAME}
            DB_PORT: ${DB_PORT}

            EMBEDDINGS_PORT: ${EMBEDDINGS_PORT}

            BACKEND_PORT: ${BACKEND_PORT}
            API_ORIGIN: ${API_ORIGIN}
            FRONTEND_ORIGIN: ${FRONTEND_URI}
            DOMAIN: ${DOMAIN}

            JWT_SECRET: ${JWT_SECRET}
            JWT_COOKIE_MAX_AGE_HOURS: ${JWT_COOKIE_MAX_AGE_HOURS}

            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

        depends_on:
            garage:
                condition: service_healthy
            postgresql:
                condition: service_healthy
            embeddings:
                condition: service_started
        volumes:
            - ../backend:/app
        command: air -c .air.toml
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s
        restart: unless-stopped
        networks:
            - app-network
            - ai-network

    frontend:
        build:
            context: ../frontend
            dockerfile: Dockerfile.dev
        container_name: frontend
        environment:
            API_LOCAL: ${API_LOCAL}
            TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
            NEXT_PUBLIC_API_ORIGIN: ${API_ORIGIN}
            NEXT_PUBLIC_FRONTEND_URI: ${FRONTEND_URI}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
        volumes:
            - ../frontend:/app
        command: npm run dev
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
            start_period: 10s
            interval: 30s
            timeout: 5s
            retries: 3
        networks:
            - app-network

    tgbot:
        build:
            context: ../tgbot
            dockerfile: Dockerfile.dev
        container_name: tgbot
        environment:
            BOT_TOKEN: ${BOT_TOKEN}
            API_LOCAL: ${API_LOCAL}
            API_ORIGIN: ${API_ORIGIN}
        volumes:
            - ../tgbot:/app
        command: air -c ./.air.toml
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - app-network
            - public

    postgresql:
        image: postgres:16-alpine
        container_name: postgresql
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_NAME}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - app-network
        restart: unless-stopped

    garage:
        image: dxflrs/garage:v2.3.0
        container_name: garage
        restart: unless-stopped
        volumes:
            - ./garage.toml:/etc/garage.toml:ro
            - garagedata:/var/lib/garage/meta
            - garagedata:/var/lib/garage/data
        networks:
            - app-network
        healthcheck:
            test: ["CMD", "/garage", "-c", "/etc/garage.toml", "status"]
            start_period: 5s
            interval: 5s
            timeout: 5s
            retries: 5

    nginx:
        image: nginx:latest
        container_name: nginx
        ports:
            - "80:80"
            - "3000:3000"
        volumes:
            - ./nginx.dev.conf:/etc/nginx/nginx.conf:roP
        networks:
            - public
            - app-network
        depends_on:
            frontend:
                condition: service_healthy

    pgadmin:
        image: dpage/pgadmin4
        container_name: pgadmin_gui
        environment:
            PGADMIN_DEFAULT_EMAIL: admin@admin.com
            PGADMIN_DEFAULT_PASSWORD: adminpassword
        ports:
            - "5050:80"
        depends_on:
            - postgresql
        networks:
            - app-network

    embeddings:
        build:
            context: ../embeddings
            dockerfile: Dockerfile
        container_name: embeddings
        gpus: all
        environment:
            EMBEDDINGS_PORT: ${EMBEDDINGS_PORT}
        depends_on:
            - qdrant
        networks:
            - ai-network
        restart: always

    qdrant:
        image: qdrant/qdrant:latest
        container_name: qdrant
        networks:
            - ai-network
        volumes:
            - qdrantdata:/qdrant/storage
            - qdrantdata:/qdrant/snapshots
        restart: always

volumes:
    pgdata:
    garagedata:
    qdrantdata:

networks:
    public:
        driver: bridge
    app-network:
        driver: bridge
    ai-network:
        driver: bridge

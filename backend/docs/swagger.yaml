definitions:
  AuthRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  BoardItemPostRequest:
    properties:
      image_id:
        type: integer
    required:
    - image_id
    type: object
  BoardItemResponse:
    properties:
      added:
        type: string
      image_metadata:
        $ref: '#/definitions/ImageMetadata'
    required:
    - added
    - image_metadata
    type: object
  BoardPatchRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  BoardPostRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - description
    - name
    type: object
  BoardResponse:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      user_id:
        type: integer
    required:
    - description
    - id
    - name
    - user_id
    type: object
  EntryResponse:
    properties:
      action:
        type: string
      affected_obj_id:
        type: integer
      created_at:
        type: string
      data:
        type: object
      id:
        type: integer
      object_type:
        type: string
      user_id:
        type: integer
    required:
    - action
    - affected_obj_id
    - created_at
    - data
    - id
    - object_type
    - user_id
    type: object
  ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  ImageError:
    properties:
      error:
        type: string
      name:
        type: string
    required:
    - error
    - name
    type: object
  ImageMetadata:
    properties:
      filename:
        type: string
      format:
        type: string
      hash:
        type: string
      height:
        type: integer
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      uploaded_at:
        type: string
      user_id:
        type: integer
      width:
        type: integer
    required:
    - filename
    - format
    - hash
    - height
    - id
    - tags
    - uploaded_at
    - user_id
    - width
    type: object
  ImagePatchRequest:
    properties:
      filename:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  ImagePostBatchResponse:
    properties:
      failures:
        items:
          $ref: '#/definitions/ImageError'
        type: array
      successes:
        items:
          $ref: '#/definitions/ImageMetadata'
        type: array
    required:
    - failures
    - successes
    type: object
  LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.UserResponce'
    required:
    - token
    - user
    type: object
  TagBatchResponse:
    properties:
      failures:
        items:
          properties:
            error:
              type: string
            name:
              type: string
          required:
          - error
          - name
          type: object
        type: array
      successes:
        items:
          $ref: '#/definitions/TagResponse'
        type: array
    required:
    - successes
    type: object
  TagPatchRequest:
    properties:
      name:
        type: string
    type: object
  TagPostBatchRequest:
    properties:
      names:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - names
    type: object
  TagPostRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  UserDataResponse:
    properties:
      id:
        type: integer
      joined_at:
        type: string
      last_seen:
        type: string
      online:
        type: boolean
      picture_url:
        type: string
      privilege:
        type: string
      username:
        type: string
    required:
    - id
    - joined_at
    - last_seen
    - online
    - picture_url
    - privilege
    - username
    type: object
  user.UserPatchRequest:
    properties:
      picture_url:
        type: string
      username:
        type: string
    type: object
  user.UserResponce:
    properties:
      id:
        type: integer
      joinedAt:
        type: string
      lastSeen:
        type: string
      online:
        type: boolean
      pictureURL:
        type: string
      privilege:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: kartonko web server
  title: kartonko API
  version: "1.0"
paths:
  /auth/google:
    get:
      description: Initiates Google OAuth login flow
      operationId: GetGoogleLogin
      parameters:
      - description: Redirect URL after login
        in: query
        name: redirect
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Google OAuth
      summary: Google OAuth login
      tags:
      - auth
  /auth/google/callback:
    get:
      description: Handles Google OAuth callback
      operationId: GetGoogleCallback
      parameters:
      - description: Authorization code
        in: query
        name: code
        required: true
        type: string
      - description: State parameter
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Google OAuth callback
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user, generating a JWT token.
      operationId: PostLogin
      parameters:
      - description: username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user, deleting the JWT token.
      operationId: PostLogout
      responses:
        "200":
          description: Logout successful
          headers:
            Set-Cookie:
              description: Clears the jwt cookie
              type: string
          schema:
            additionalProperties: true
            type: object
      summary: Logout a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user, generating a JWT token.
      operationId: PostRegister
      parameters:
      - description: username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /board:
    get:
      description: Returns a slice of list of boards
      operationId: ListBoards
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/BoardResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List boards
      tags:
      - boards
    post:
      operationId: PostBoard
      parameters:
      - description: Board creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/BoardPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/BoardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Creates new board
      tags:
      - boards
  /board/{id}:
    delete:
      operationId: DeleteBoard
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Delete board by id
      tags:
      - boards
    get:
      operationId: GetBoard
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets board metadata by id
      tags:
      - boards
    patch:
      operationId: PatchBoard
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Board patch request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/BoardPatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoardResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Patches existing board by id
      tags:
      - boards
  /board/{id}/image:
    get:
      description: Returns a slice of board's items
      operationId: ListBoardImages
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/BoardItemResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List board items
      tags:
      - boards
    post:
      operationId: PostBoardImage
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Board item creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/BoardItemPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/BoardItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Adds image to a board
      tags:
      - boards
  /board/{id}/image/{imageID}:
    delete:
      operationId: DeleteBoardImage
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Image ID
        format: int64
        in: path
        name: imageID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Removes image from board by id
      tags:
      - boards
    get:
      operationId: GetBoardImage
      parameters:
      - description: Board ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Image ID
        format: int64
        in: path
        name: imageID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/BoardItemResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image from the board
      tags:
      - boards
  /health:
    get:
      description: Returns "ok" if server is up and running
      operationId: GetHealthCheck
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Health check
      tags:
      - healthcheck
  /image:
    delete:
      description: Deletes multiple images matching the query parameters (requires
        authentication)
      operationId: DeleteImagesByQuery
      parameters:
      - description: Filter by name prefix
        in: query
        name: prefix
        type: string
      - description: JSON array of tags
        in: query
        name: tags
        type: string
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes images by query
      tags:
      - images
    get:
      description: Returns a list of images matching the query parameters
      operationId: GetImagesByQuery
      parameters:
      - description: Filter by name prefix
        in: query
        name: prefix
        type: string
      - description: Interpret prefix as a natural-language semantic query
        in: query
        name: semantic
        type: boolean
      - collectionFormat: csv
        description: Comma separated or array
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ImageMetadata'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets images by query
      tags:
      - images
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image with metadata (requires authentication)
      operationId: PostImage
      parameters:
      - description: Image file
        in: formData
        name: file
        required: true
        type: file
      - description: Image name
        in: formData
        name: name
        required: true
        type: string
      - collectionFormat: csv
        description: Array of tags
        in: formData
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ImageMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Uploads a single image
      tags:
      - images
  /image/{id}:
    delete:
      description: Deletes an image by its ID (requires authentication)
      operationId: DeleteImage
      parameters:
      - description: Image ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes an image by ID
      tags:
      - images
    get:
      description: Returns image metadata by its numeric ID
      operationId: GetImage
      parameters:
      - description: Image ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image metadata by ID
      tags:
      - images
    patch:
      operationId: PatchImage
      parameters:
      - description: Image ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      - description: Image patch request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ImagePatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Patches existing image metadata by ID
      tags:
      - images
  /image/{id}/raw:
    get:
      description: Returns the raw image file by its ID
      operationId: GetRawImage
      parameters:
      - description: Image ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image by ID
      tags:
      - images
  /image/{id}/thumb:
    get:
      description: Returns the raw thumbnail image file by its ID
      operationId: GetRawThumbnail
      parameters:
      - description: Image ID thumbnail
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw thumbnail image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image thumbnail by ID
      tags:
      - images
  /image/batch:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads multiple images with metadata in a single request (requires authentication)
        !!Swagger to openapi conversion doesn't support file arrays
      operationId: PostImagesBatch
      parameters:
      - description: Batch metadata (JSON)
        example: '{"data": [{"name": "img1", "tags": ["tag1"]}, {"name": "img2", "tags":
          ["tag2"]}], "common_tags": ["common"]}'
        in: formData
        name: metadata
        required: true
        type: string
      - description: Files to upload
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ImagePostBatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Uploads multiple images in batch
      tags:
      - images
  /image/hash/{hash}:
    get:
      description: Returns image metadata by its hash
      operationId: GetImageByHash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image metadata by its unique hash
      tags:
      - images
  /image/hash/{hash}/raw:
    get:
      description: Returns the raw image file by its hash
      operationId: GetRawImageByHash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image by hash
      tags:
      - images
  /image/hash/{hash}/thumb:
    get:
      description: Returns the raw thumbnail image file by its hash
      operationId: GetRawThumbnailByHash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw thumbnail image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image thumbnail by hash
      tags:
      - images
  /image/name/{name}:
    delete:
      description: Deletes an image by its name (requires authentication)
      operationId: DeleteImageByName
      parameters:
      - description: Image name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes an image by name
      tags:
      - images
    get:
      description: Returns image metadata by its name
      operationId: GetImageByName
      parameters:
      - description: Image name
        in: path
        name: name

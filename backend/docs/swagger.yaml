definitions:
  AuthRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  EntryResponse:
    properties:
      action:
        type: string
      affected_obj_id:
        type: integer
      created_at:
        type: string
      data:
        type: object
      id:
        type: integer
      object_type:
        type: string
      user_id:
        type: integer
    required:
    - action
    - affected_obj_id
    - created_at
    - data
    - id
    - object_type
    - user_id
    type: object
  ErrorResponse:
    properties:
      error:
        type: string
    required:
    - error
    type: object
  ImageError:
    properties:
      error:
        type: string
      name:
        type: string
    required:
    - error
    - name
    type: object
  ImageMetadata:
    properties:
      filename:
        type: string
      format:
        type: string
      hash:
        type: string
      height:
        type: integer
      id:
        type: integer
      tags:
        items:
          type: string
        type: array
      uploaded_at:
        type: string
      user_id:
        type: integer
      width:
        type: integer
    required:
    - filename
    - format
    - hash
    - height
    - id
    - tags
    - uploaded_at
    - user_id
    - width
    type: object
  ImagePostBatchResponse:
    properties:
      failures:
        items:
          $ref: '#/definitions/ImageError'
        type: array
      successes:
        items:
          $ref: '#/definitions/ImageMetadata'
        type: array
    required:
    - failures
    - successes
    type: object
  LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/user.UserResponce'
    required:
    - token
    - user
    type: object
  TagBatchResponse:
    properties:
      failures:
        items:
          properties:
            error:
              type: string
            name:
              type: string
          required:
          - error
          - name
          type: object
        type: array
      successes:
        items:
          $ref: '#/definitions/TagResponse'
        type: array
    required:
    - successes
    type: object
  TagPostBatchRequest:
    properties:
      names:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - names
    type: object
  TagPostRequest:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  TagResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - id
    - name
    type: object
  UserDataResponse:
    properties:
      id:
        type: integer
      joined_at:
        type: string
      last_seen:
        type: string
      online:
        type: boolean
      picture_url:
        type: string
      privilege:
        type: string
      username:
        type: string
    required:
    - id
    - joined_at
    - last_seen
    - online
    - picture_url
    - privilege
    - username
    type: object
  user.UserResponce:
    properties:
      id:
        type: integer
      joinedAt:
        type: string
      lastSeen:
        type: string
      online:
        type: boolean
      pictureURL:
        type: string
      privilege:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
  description: kartonko web server
  title: kartonko API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user, generating a JWT token.
      parameters:
      - description: username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Login a user
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logs out a user, deleting the JWT token.
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Logout a user
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user, generating a JWT token.
      parameters:
      - description: username and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/AuthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Register a user
      tags:
      - auth
  /health:
    get:
      description: Returns "ok" if server is up and running
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Health check
      tags:
      - healthcheck
  /image:
    delete:
      description: Deletes multiple images matching the query parameters (requires
        authentication)
      parameters:
      - description: Filter by name prefix
        in: query
        name: prefix
        type: string
      - description: JSON array of tags
        in: query
        name: tags
        type: string
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes images by query
      tags:
      - images
    get:
      description: Returns a list of images matching the query parameters
      parameters:
      - description: Filter by name prefix
        in: query
        name: prefix
        type: string
      - collectionFormat: csv
        description: Comma separated or array
        in: query
        items:
          type: string
        name: tags
        type: array
      - description: Filter by username
        in: query
        name: username
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ImageMetadata'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets images by query
      tags:
      - images
  /image/{name}:
    delete:
      description: Deletes an image by its name (requires authentication)
      parameters:
      - description: Image name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Deletes an image by name
      tags:
      - images
    get:
      description: Returns image metadata by its name
      parameters:
      - description: Image name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image metadata by name
      tags:
      - images
  /image/hash/{hash}:
    get:
      description: Returns image metadata by its hash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image metadata by its unique hash
      tags:
      - images
  /image/id/{id}:
    get:
      description: Returns image metadata by its numeric ID
      parameters:
      - description: Image ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ImageMetadata'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets image metadata by ID
      tags:
      - images
  /image/raw/{name}:
    get:
      description: Returns the raw image file by its name
      parameters:
      - description: Image name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image by name
      tags:
      - images
  /image/raw/hash/{hash}:
    get:
      description: Returns the raw image file by its hash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image by hash
      tags:
      - images
  /image/thumb/{name}:
    get:
      description: Returns the raw thumbnail image file by its name
      parameters:
      - description: Image thumbnail name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw thumbnail image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image thumbnail by name
      tags:
      - images
  /image/thumb/hash/{hash}:
    get:
      description: Returns the raw thumbnail image file by its hash
      parameters:
      - description: Image hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Raw thumbnail image file
          schema:
            type: file
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets raw image thumbnail by hash
      tags:
      - images
  /image/upload:
    post:
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ImageMetadata'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
  /image/upload/batch:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Uploads multiple images with metadata in a single request (requires authentication)
        !!Swagger to openapi conversion doesn't support file arrays
      parameters:
      - description: Batch metadata (JSON)
        example: '{"data": [{"name": "img1", "tags": ["tag1"]}, {"name": "img2", "tags":
          ["tag2"]}], "common_tags": ["common"]}'
        in: formData
        name: metadata
        required: true
        type: string
      - description: Files to upload
        in: formData
        name: files
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/ImagePostBatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Uploads multiple images in batch
      tags:
      - images
  /log:
    get:
      description: Returns a paginated list of audit log entries
      parameters:
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/EntryResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets audit log entries
      tags:
      - log
  /tags:
    get:
      description: Returns a paginated list of all tags
      parameters:
      - description: Tag name prefix
        in: query
        name: prefix
        type: string
      - description: Pagination cursor
        in: query
        name: cursor
        type: integer
      - default: 20
        description: Limit results
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/TagResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets all tags
      tags:
      - tags
    post:
      consumes:
      - application/json
      description: Creates a new tag (requires authentication)
      parameters:
      - description: Tag name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/TagPostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/TagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Creates a new tag
      tags:
      - tags
  /tags/batch:
    post:
      consumes:
      - application/json
      description: Creates multiple tags in a single request (requires authentication)
      parameters:
      - description: Tag names
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/TagPostBatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TagBatchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Creates multiple tags in batch
      tags:
      - tags
  /user/{name}:
    get:
      description: Returns user profile by username
      parameters:
      - description: Username
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDataResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets user by username
      tags:
      - user
  /user/id/{id}:
    get:
      description: Returns user profile by numeric ID
      parameters:
      - description: User ID
        format: int64
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Gets user by ID
      tags:
      - user
  /user/me:
    get:
      description: Returns the authenticated user's profile (requires authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Gets current user profile
      tags:
      - user
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: Bearer JWT authentication.
    in: cookie
    name: jwt
    type: apiKey
swagger: "2.0"
